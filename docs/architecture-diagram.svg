<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="620" fill="#f8fafc" />

  <text x="20" y="34" font-size="20" font-weight="700" fill="#0f172a">gcp-go — Clinic Scheduling Platform (GCP)</text>
  <text x="20" y="56" font-size="13" fill="#64748b">Cloud Run + Firestore + Pub/Sub + Eventarc + Cloud SQL, Clean Architecture (Go)</text>

  <!-- Client -->
  <g>
    <rect x="30" y="110" width="180" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
    <text x="120" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Cliente</text>
    <text x="120" y="153" text-anchor="middle" font-size="10.5" fill="#4338ca">agent / insured (JWT)</text>
  </g>

  <!-- API Gateway -->
  <g>
    <rect x="260" y="110" width="180" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <text x="350" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">API Gateway</text>
    <text x="350" y="153" text-anchor="middle" font-size="10" fill="#1e40af">quota 1500 req/min</text>
  </g>

  <!-- api service -->
  <g>
    <rect x="260" y="220" width="180" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="350" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Cloud Run: api</text>
    <text x="350" y="263" text-anchor="middle" font-size="10" fill="#166534">crea PENDING</text>
  </g>

  <g>
    <ellipse cx="130" cy="250" rx="90" ry="35" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="130" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Firestore</text>
    <text x="130" y="263" text-anchor="middle" font-size="9.5" fill="#92400e">appointments + events</text>
  </g>

  <!-- Pub/Sub -->
  <g>
    <rect x="500" y="220" width="180" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
    <text x="590" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">Pub/Sub</text>
    <text x="590" y="263" text-anchor="middle" font-size="10" fill="#854d0e">appointment-created</text>
  </g>

  <!-- worker -->
  <g>
    <rect x="920" y="220" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="1020" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Cloud Run: worker</text>
    <text x="1020" y="263" text-anchor="middle" font-size="10" fill="#166534">persiste + publica</text>
  </g>

  <g>
    <ellipse cx="1020" cy="340" rx="100" ry="35" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="1020" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Cloud SQL</text>
    <text x="1020" y="353" text-anchor="middle" font-size="9.5" fill="#92400e">appointments</text>
  </g>

  <!-- Eventarc -->
  <g>
    <rect x="700" y="340" width="180" height="60" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="790" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#701a75">Eventarc trigger</text>
    <text x="790" y="383" text-anchor="middle" font-size="10" fill="#86198f">appointment-confirmed</text>
  </g>

  <g>
    <rect x="470" y="340" width="180" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
    <text x="560" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">Pub/Sub push</text>
    <text x="560" y="383" text-anchor="middle" font-size="10" fill="#854d0e">confirmación</text>
  </g>

  <!-- confirm -->
  <g>
    <rect x="240" y="340" width="180" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="330" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Cloud Run: confirm</text>
    <text x="330" y="383" text-anchor="middle" font-size="10" fill="#166534">marca COMPLETED</text>
  </g>

  <!-- SendGrid -->
  <g>
    <rect x="30" y="340" width="180" height="60" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="120" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#701a75">SendGrid</text>
    <text x="120" y="383" text-anchor="middle" font-size="10" fill="#86198f">notificación email</text>
  </g>

  <!-- Observability -->
  <g>
    <rect x="920" y="110" width="200" height="70" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="1020" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#701a75">Cloud Trace</text>
    <text x="1020" y="156" text-anchor="middle" font-size="10" fill="#86198f">OpenTelemetry en api/worker/confirm</text>
  </g>

  <!-- Notes -->
  <g>
    <rect x="30" y="440" width="1090" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="50" y="466" font-size="12" font-weight="700" fill="#0f172a">Notas de diseño</text>
    <text x="50" y="488" font-size="10.5" fill="#334155">• Confirmación en dos etapas: worker persiste en Cloud SQL y publica; un trigger de Eventarc (no una suscripción push directa)</text>
    <text x="50" y="506" font-size="10.5" fill="#334155">  enruta al servicio confirm, que marca COMPLETED en Firestore — mismo patrón que aws-typescript/azure-python, distinto bus.</text>
    <text x="50" y="528" font-size="10.5" fill="#334155">• El servicio api sigue siendo accesible directo (tests, CI, Postman); el API Gateway es la ruta adicional recomendada.</text>
    <text x="50" y="550" font-size="10.5" fill="#334155">• Cada llamada a Firestore/Pub/Sub/Cloud SQL genera su propio span vía el wrapper resilience.Resilience.Run (instrumentado 1 vez).</text>
  </g>

  <!-- Arrows -->
  <line x1="210" y1="140" x2="258" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="215" y="132" font-size="9.5" fill="#1d4ed8">HTTPS + JWT</text>

  <line x1="350" y1="170" x2="350" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="258" y1="250" x2="222" y2="250" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="440" y1="250" x2="498" y2="250" stroke="#ca8a04" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="680" y1="250" x2="918" y2="250" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="1020" y1="280" x2="1020" y2="303" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="920" y1="370" x2="882" y2="370" stroke="#a21caf" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="700" y1="370" x2="652" y2="370" stroke="#ca8a04" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="470" y1="370" x2="422" y2="370" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="330" y1="340" x2="335" y2="282" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  <text x="340" y="315" font-size="9" fill="#92400e">COMPLETED</text>
  <line x1="240" y1="370" x2="212" y2="370" stroke="#a21caf" stroke-width="1.8" marker-end="url(#arrow)" />

  <text x="20" y="605" font-size="10.5" fill="#94a3b8">Hermano de agendamiento de citas en el trío AWS/Azure/GCP — mismo dominio y Clean Architecture, distinta nube (ver README para el diagrama Mermaid equivalente).</text>
</svg>
